openapi: 3.0.3
info:
  title: Petstore Demo API
  version: 1.0.0
paths: {}
components:
  schemas:
    Pet:
      type: object
      description: A pet available in the store.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The pet's display name.
        status:
          type: string
        adopted_at:
          type: string
          format: date-time
        weight_kg:
          type: number
        vaccinated:
          type: boolean
        tags:
          type: array
          items:
            type: string
        owner:
          $ref: '#/components/schemas/Owner'
    Owner:
      type: object
      required:
        - owner_id
      properties:
        owner_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        signup_date:
          type: string
          format: date
