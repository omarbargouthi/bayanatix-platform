# Release: pushing a version tag (v1.4.0) builds the image, publishes it and deploys it
# to the demo server. Nothing is deployed by an ordinary push to master.
#
# Repository secrets needed (Settings › Secrets and variables › Actions):
#   DEPLOY_HOST     the server's address
#   DEPLOY_USER     the SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY  that user's private key
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/omarbargouthi/bayanatix-platform:${{ github.ref_name }}
            ghcr.io/omarbargouthi/bayanatix-platform:latest
          build-args: NEXT_PUBLIC_APP_ENVIRONMENT=DEMO
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy the compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/production/docker-compose.yml,deploy/production/Caddyfile,deploy/production/initdb/01-databases.sh"
          target: /opt/bayanis
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_VERSION: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_VERSION,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/bayanis
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Remember the version, so a manual "docker compose up" starts the same one.
            sed -i "s/^APP_VERSION=.*/APP_VERSION=$APP_VERSION/" .env
            docker compose pull app
            docker compose up -d db
            # A backup before every release: restoring it is the rollback for the data.
            mkdir -p backups
            docker compose exec -T db pg_dump -U postgres -Fc bayanatix > "backups/bayanatix-before-$APP_VERSION.dump"
            docker compose run --rm app node scripts/migrate-tracked.mjs
            docker compose up -d --remove-orphans
            docker image prune -f
            ls -t backups/*.dump | tail -n +11 | xargs -r rm --
